<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-white transition-colors duration-300">

    <nav id="navbar" class="bg-white dark:bg-gray-800 shadow-md fixed w-full top-0 z-40 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center cursor-pointer" onclick="showPage('home')">
                    <svg class="w-7 h-7 text-blue-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    <span id="siteName" class="text-2xl font-bold text-gray-800 dark:text-white">ShopHub</span>
                </div>

                <div class="hidden md:flex flex-1 mx-8">
                    <div class="relative w-full max-w-lg">
                        <input type="text" id="searchInput" placeholder="Search for products..." 
                            class="w-full px-4 py-2 rounded-full border dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-600">
                        <button onclick="handleSearch()" class="absolute right-3 top-2.5 text-gray-500 dark:text-gray-300">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="hidden md:flex items-center space-x-6">
                    <button onclick="showPage('home')" class="nav-link dark:text-gray-300 dark:hover:text-blue-500">Home</button>
                    <button onclick="showPage('about')" class="nav-link dark:text-gray-300 dark:hover:text-blue-500">About</button>
                    <button onclick="showPage('contact')" class="nav-link dark:text-gray-300 dark:hover:text-blue-500">Contact</button>
                    
                    <div class="flex items-center space-x-4">
                        <button onclick="toggleDarkMode()" class="text-gray-700 dark:text-yellow-400 hover:text-blue-600 p-1">
                            <svg id="themeIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                            </svg>
                        </button>

                        <button class="relative" onclick="showPage('cart')">
                            <svg class="w-6 h-6 text-gray-700 dark:text-gray-300 hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                            </svg>
                            <span id="cartCount" class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
                        </button>
                        
                        <div id="authSection">
                            <button id="loginBtn" onclick="showPage('login')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                                Login
                            </button>
                            <div id="userProfile" class="hidden flex items-center space-x-3 cursor-pointer relative group">
                                <img src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff" class="w-8 h-8 rounded-full">
                                <div class="absolute right-0 top-8 w-48 bg-white dark:bg-gray-700 shadow-xl rounded-lg hidden group-hover:block py-2">
                                    <button onclick="logout()" class="block w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-white hover:bg-gray-100 dark:hover:bg-gray-600">Logout</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="md:hidden text-gray-700 dark:text-white" onclick="toggleMobileMenu()">
                    <svg id="menuIcon" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>

            <div id="mobileMenu" class="hidden md:hidden py-4 border-t dark:border-gray-700">
                <input type="text" id="mobileSearchInput" placeholder="Search..." class="w-full mb-4 px-4 py-2 rounded border dark:bg-gray-700 dark:text-white">
                <button onclick="handleSearch(); toggleMobileMenu()" class="w-full bg-blue-600 text-white py-2 rounded mb-4">Search</button>
                <button onclick="showPage('home'); toggleMobileMenu()" class="block w-full text-left py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-white">Home</button>
                <button onclick="showPage('cart'); toggleMobileMenu()" class="block w-full text-left py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-white">Cart</button>
                <button onclick="showPage('about'); toggleMobileMenu()" class="block w-full text-left py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-white">About</button>
                <button onclick="showPage('contact'); toggleMobileMenu()" class="block w-full text-left py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-white">Contact</button>
                <button id="mobileLoginBtn" onclick="showPage('login'); toggleMobileMenu()" class="block w-full text-left py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-white">Login</button>
                <button onclick="toggleDarkMode(); toggleMobileMenu()" class="block w-full text-left py-2 px-4 hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-white">Toggle Theme</button>
            </div>
        </div>

    <main id="mainContent" class="pt-16 min-h-screen"></main>

    <button id="chatToggle" onclick="toggleChat()" class="fixed bottom-6 right-6 bg-blue-600 text-white p-4 rounded-full shadow-lg hover:bg-blue-700 transition-colors z-50">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
    </button>

    <div id="chatWindow" class="hidden fixed bottom-24 right-6 w-96 bg-white dark:bg-gray-800 rounded-lg shadow-2xl z-50 overflow-hidden border dark:border-gray-700">
        <div class="bg-blue-600 text-white p-4">
            <h3 class="text-lg font-semibold">How can we help you?</h3>
        </div>

        <div id="chatContent" class="p-4 h-96 overflow-y-auto">
            <div id="chatOptions">
                <p class="text-gray-700 dark:text-gray-300 mb-4">Please select an option:</p>
                <button onclick="selectChatOption('query')" class="w-full flex items-center p-3 border dark:border-gray-600 rounded-lg hover:bg-blue-50 dark:hover:bg-gray-700 hover:border-blue-600 transition-colors mb-3">

                    <span class="font-medium dark:text-white">Product Query</span>
                </button>
                <button onclick="selectChatOption('feedback')" class="w-full flex items-center p-3 border dark:border-gray-600 rounded-lg hover:bg-blue-50 dark:hover:bg-gray-700 hover:border-blue-600 transition-colors mb-3">
                    <svg class="w-5 h-5 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                    <span class="font-medium dark:text-white">Feedback / Review</span>
                </button>
                <button onclick="selectChatOption('support')" class="w-full flex items-center p-3 border dark:border-gray-600 rounded-lg hover:bg-blue-50 dark:hover:bg-gray-700 hover:border-blue-600 transition-colors">
                    <svg class="w-5 h-5 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <span class="font-medium dark:text-white">Support</span>
                </button>
            </div>

            <div id="chatForm" class="hidden">
                <button onclick="backToOptions()" class="text-blue-600 mb-4 flex items-center hover:underline">
                    ← Back
                </button>
                <h4 id="formTitle" class="text-lg font-semibold mb-4 capitalize dark:text-white"></h4>
                <form onsubmit="submitChatForm(event)">
                    <div class="mb-3">
                        <label class="block text-gray-700 dark:text-gray-300 mb-1 text-sm">Name</label>
                        <input type="text" id="chatName" class="w-full px-3 py-2 border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" required>
                    </div>
                    <div class="mb-3">
                        <label class="block text-gray-700 dark:text-gray-300 mb-1 text-sm">Email</label>
                        <input type="email" id="chatEmail" class="w-full px-3 py-2 border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" required>
                    </div>
                    <div class="mb-3">
                        <label class="block text-gray-700 dark:text-gray-300 mb-1 text-sm">Message / Query</label>
                        <textarea id="chatMessage" rows="4" class="w-full px-3 py-2 border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors font-semibold">
                        Submit
                    </button>
                </form>
            </div>
        </div>
    </div>

    <footer class="bg-gray-800 dark:bg-gray-950 text-white pt-12 pb-6">
        <div class="max-w-7xl mx-auto px-4">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">

                <div>
                    <h4 class="text-lg font-semibold mb-4">Quick Links</h4>
                    <ul class="space-y-2">
                        <li><button onclick="showPage('home')" class="text-gray-400 hover:text-white">Home</button></li>
                        <li><button onclick="showPage('about')" class="text-gray-400 hover:text-white">About</button></li>
                        <li><button onclick="showPage('contact')" class="text-gray-400 hover:text-white">Contact</button></li>
                    </ul>
                </div>

                <div>
                    <h4 class="text-lg font-semibold mb-4">Contact</h4>
                    <ul class="space-y-2 text-gray-400">
                        <li id="footerEmail">contact@shophub.com</li>
                        <li id="footerPhone">+91 1234567890</li>
                    </ul>

                        <a href="https://instagram.com" target="_blank" class="text-gray-400 hover:text-white"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>

            <div class="border-t border-gray-700 pt-6 text-center text-gray-400">
                <p>&copy; 2024 <span id="footerCopyright">ShopHub</span>. All rights reserved.</p>
            </div>
